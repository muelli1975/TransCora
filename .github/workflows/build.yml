name: Test and build TransCora

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: Test engine and GUI
        env:
          TRANSCORA_REQUIRE_FFMPEG: '1'
          TRANSCORA_REQUIRE_GUI: '1'
        run: xvfb-run -a python -m unittest discover -s tests -v

  windows-portable:
    needs: linux-tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Download and verify pinned FFmpeg toolchain
        run: python scripts/fetch_ffmpeg.py
      - name: Test Windows codecs and GUI
        env:
          TRANSCORA_REQUIRE_FFMPEG: '1'
          TRANSCORA_REQUIRE_GUI: '1'
        run: python -m unittest discover -s tests -v
      - name: Build portable application
        run: python scripts/build_windows.py
      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/TransCora/TransCora.exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "TransCora exited before its window could open" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        with:
          name: TransCora-Windows
          path: |
            dist/TransCora.zip
            dist/TransCora.zip.sha256
          if-no-files-found: error
          retention-days: 30
