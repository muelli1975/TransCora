name: Test and build TransCora

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README_DE.md'
      - 'BUILD.md'
      - 'THIRD_PARTY.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this tested stable version as a new release'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: transcora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
          python -m pip install Pillow==11.3.0 pillow-heif==1.8.1 cmake==4.4.4 customtkinter==5.2.2 darkdetect==0.8.0
          python scripts/prepare_exiftool.py
      - name: Build pinned native CIELab image method
        run: python scripts/build_cielab.py
      - name: Test engine and GUI
        env:
          TRANSCORA_REQUIRE_FFMPEG: '1'
          TRANSCORA_REQUIRE_GUI: '1'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Test lossless extraction of original Fujifilm camera MPO
        run: python scripts/mpo_camera_test.py
      - name: Build and check portable MVC decoder
        run: python scripts/build_mvc_decoder.py

  windows-portable:
    needs: linux-tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Download and verify pinned FFmpeg toolchain
        run: python scripts/fetch_ffmpeg.py
      - name: Download and verify pinned BD-3D tools
        run: python scripts/fetch_bd3d_tools.py
      - name: Download and verify pinned ExifTool with support files
        run: python scripts/prepare_exiftool.py
      - name: Build pinned native CIELab image method
        run: python scripts/build_cielab.py
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Build pinned portable MVC decoder
        shell: msys2 {0}
        run: python scripts/build_mvc_decoder.py
      - name: Test Windows codecs and GUI
        env:
          TRANSCORA_REQUIRE_FFMPEG: '1'
          TRANSCORA_REQUIRE_GUI: '1'
        run: python -m unittest discover -s tests -v
      - name: Test lossless extraction of original Fujifilm camera MPO
        run: python scripts/mpo_camera_test.py
      - name: Capture Windows GUI for visual review
        run: python scripts/gui_snapshot.py
      - name: Test actual BD-3D ISO and M2TS exports
        run: python scripts/bd3d_export_test.py
      - name: Test BD-3D timestamp jitter and variable frame timing
        run: python scripts/bd3d_timing_test.py
      - name: Test LPCM longer than the old 4 GiB WAV limit
        run: python scripts/large_lpcm_test.py
      - name: Test MVC and MV-HEVC inputs with both views
        run: python scripts/multiview_test.py
      - name: Build portable application
        run: python scripts/build_windows.py
      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "transcora-smoke.json"
          $process = Start-Process -FilePath ./dist/TransCora/TransCora.exe -ArgumentList @("--self-test", "`"$report`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "TransCora self-test failed" }
          $result = Get-Content $report | ConvertFrom-Json
          if (-not $result.ok -or $result.methods -ne 17 -or -not $result.bd3d -or -not $result.mvc -or -not $result.images -or -not $result.cielab -or -not $result.heif) { throw "TransCora assets/toolchain check failed" }
          Get-Content $report
      - name: Test the packaged HEIF reader with both tagged half-images
        run: python scripts/probe_1_1_heif.py --ffmpeg dist/TransCora/tools/ffmpeg/bin/ffmpeg.exe --reader dist/TransCora/tools/heif/TransCora-HEIF.exe --application dist/TransCora/TransCora.exe --folder work/heif-package-test --report work/heif-package-test/report.json
      - name: Test Dual MP4 and MKV through the packaged application
        run: python scripts/check_dual_package.py --application dist/TransCora/TransCora.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TransCora-Release-Windows
          path: |
            dist/TransCora_*_Windows_x64.zip
            dist/TransCora_*_Windows_x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TransCora-Multiview-Integration
          path: output/multiview-integration/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TransCora-BD3D-Integration
          path: |
            output/bd3d-integration/
            output/bd3d-timing/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TransCora-GUI-Check
          path: output/gui-check/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TransCora-MPO-Integration
          path: output/mpo-integration/
          if-no-files-found: warn
          retention-days: 30

  unix-packages:
    needs: linux-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux_x64
          - os: macos-14
            label: macOS_AppleSilicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install Linux video and display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb perl
      - name: Install macOS video tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg@7
      - name: Prepare image tools
        run: |
          python scripts/build_cielab.py
          python scripts/prepare_exiftool.py
      - name: Build Linux MVC reader
        if: runner.os == 'Linux'
        run: python scripts/build_mvc_decoder.py
      - name: Test Linux application
        if: runner.os == 'Linux'
        env:
          TRANSCORA_REQUIRE_FFMPEG: '1'
          TRANSCORA_REQUIRE_GUI: '1'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Test macOS application
        if: runner.os == 'macOS'
        env:
          TRANSCORA_REQUIRE_FFMPEG: '1'
          TRANSCORA_REQUIRE_GUI: '1'
        run: python -m unittest discover -s tests -v
      - name: Build application package
        run: python scripts/build_windows.py
      - name: Smoke test Linux executable
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/TransCora/TransCora --self-test smoke.json
      - name: Smoke test macOS executable and app
        if: runner.os == 'macOS'
        run: |
          dist/TransCora/TransCora --self-test smoke.json
          dist/TransCora/TransCora.app/Contents/MacOS/TransCora --self-test smoke-app.json
      - name: Test the packaged HEIF reader
        run: python scripts/probe_1_1_heif.py --ffmpeg "$(command -v ffmpeg)" --reader dist/TransCora/tools/heif/TransCora-HEIF --application dist/TransCora/TransCora --folder work/heif-package-test --report work/heif-package-test/report.json
      - name: Test Dual MP4 and MKV through the packaged application
        run: python scripts/check_dual_package.py --application dist/TransCora/TransCora
      - uses: actions/upload-artifact@v4
        with:
          name: TransCora-Release-${{ matrix.label }}
          path: |
            dist/TransCora_*_*.tar.gz
            dist/TransCora_*_*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [windows-portable, unix-packages]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
       (github.event_name == 'push' && github.event.head_commit.message == 'Update TransCora 1.1: add fixed-size image fitting'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TransCora-Release-*
          path: release-files
          merge-multiple: true
      - name: Publish a tested stable version without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "from transcora import __version__; print(__version__)")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ || "$version" == "1.0" ]]; then
            echo 'Development or legacy build; keeping release publication disabled.'
            exit 0
          fi
          current_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo 'A newer revision is being tested; skipping this superseded publication.'
            exit 0
          fi
          tag="v$version"
          notes="docs/RELEASE_NOTES_$version.md"
          test -f "$notes"
          # Update the existing 1.1 only for this explicitly requested revision.
          if [ "$version" = "1.1" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            release_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1" --jq '.object.sha')
            case "$release_head" in
              6895841fe5d98ff6935943bc0421b029c61f5f53|"$GITHUB_SHA") ;;
              *) echo 'Release 1.1 changed independently; leaving it unchanged.'; exit 1 ;;
            esac
            gh release upload v1.1 release-files/* --clobber
            if [ "$release_head" != "$GITHUB_SHA" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.1" -f sha="$GITHUB_SHA" -F force=false
            fi
            gh release edit v1.1 --title 'TransCora 1.1' --notes-file "$notes" --latest
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            if [ "$draft" != "true" ]; then
              echo 'This stable release already exists; leaving its tag and assets unchanged.'
              exit 0
            fi
            release_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
            if [ "$release_head" != "$GITHUB_SHA" ]; then
              echo 'The existing draft belongs to another revision; leaving it unchanged.'
              exit 1
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "TransCora $version" --notes-file "$notes"
          fi
          gh release upload "$tag" release-files/* --clobber
          gh release edit "$tag" --draft=false --latest

  publish-color-update:
    needs: [windows-portable, unix-packages]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'Fix SDR color handling and refresh TransCora 1.1 packages'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TransCora-Release-*
          path: release-files
          merge-multiple: true
      - name: Refresh the authorized existing packages after all tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_color_update.py --root release-files --config .github/color-update.json
